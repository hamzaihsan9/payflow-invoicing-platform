<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFlow — Invoicing &amp; Billing Management</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#4f46e5',
              600: '#4338ca',
              700: '#3730a3',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0c0d12;
      color: #e4e4e7;
      letter-spacing: -0.011em;
    }
    .num { font-feature-settings: 'tnum' on, 'cv05' on; }
    /* Clean custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0c0d12; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="min-h-screen bg-[#0c0d12] text-zinc-200 antialiased selection:bg-indigo-500/20 selection:text-indigo-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = "http://localhost:8000/api/v1";

    function App() {
      const [currentView, setCurrentView] = useState('invoices');
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [showModal, setShowModal] = useState(false);
      const [notification, setNotification] = useState(null);

      // Financial Metrics
      const [stats, setStats] = useState({
        total_revenue: 870000,
        total_outstanding: 1624000,
        total_invoices: 3,
        paid_count: 1,
        issued_count: 1,
        overdue_count: 1
      });

      // Invoices
      const [invoices, setInvoices] = useState([
        {
          id: 1,
          invoice_number: "INV-2026-0001",
          client: { company: "Systems Limited", name: "Asif Peer", email: "accounts@systemsltd.com" },
          status: "PAID",
          issue_date: "2026-09-20",
          due_date: "2026-10-05",
          currency: "PKR",
          subtotal: 750000,
          tax_amount: 120000,
          total_amount: 870000,
          notes: "Kubernetes Cluster & FastAPI Architecture Consultation"
        },
        {
          id: 2,
          invoice_number: "INV-2026-0002",
          client: { company: "Jazz Telecom (PMCL)", name: "Aamir Ibrahim", email: "procurement@jazz.com.pk" },
          status: "ISSUED",
          issue_date: "2026-10-05",
          due_date: "2026-10-25",
          currency: "PKR",
          subtotal: 480000,
          tax_amount: 76800,
          total_amount: 556800,
          notes: "Client Portal & Telemetry Sync Services"
        },
        {
          id: 3,
          invoice_number: "INV-2026-0003",
          client: { company: "Arbisoft Technologies", name: "Yasser Bashir", email: "billing@arbisoft.com" },
          status: "OVERDUE",
          issue_date: "2026-08-30",
          due_date: "2026-09-30",
          currency: "PKR",
          subtotal: 920000,
          tax_amount: 147200,
          total_amount: 1067200,
          notes: "BERT Classification Pipeline Optimization"
        }
      ]);

      // Corporate Clients
      const [clients, setClients] = useState([
        { id: 1, company: "Systems Limited", name: "Asif Peer", email: "accounts@systemsltd.com", phone: "+92 42 111-797-836", tax_id: "NTN-0814920-1", address: "DHA Phase 1, Lahore" },
        { id: 2, company: "Jazz Telecom (PMCL)", name: "Aamir Ibrahim", email: "procurement@jazz.com.pk", phone: "+92 51 111-300-300", tax_id: "NTN-0710123-4", address: "Jazz HQ, G-8/4, Islamabad" },
        { id: 3, company: "Arbisoft Technologies", name: "Yasser Bashir", email: "billing@arbisoft.com", phone: "+92 42 35954601", tax_id: "NTN-2938472-8", address: "Canal Bank Road, Lahore" },
        { id: 4, company: "10Pearls Pakistan", name: "Zeeshan Aftab", email: "finance.pk@10pearls.com", phone: "+92 21 34328571", tax_id: "NTN-3849102-5", address: "PECHS Block 6, Karachi" }
      ]);

      // Form State
      const [newInvoice, setNewInvoice] = useState({
        client_id: 1,
        due_date: "2026-11-15",
        tax_rate: 0.16,
        notes: "Remittance via RAAST / IBFT (Net-30 payment schedule)",
        items: [
          { description: "Software Engineering & Backend Support", quantity: 1, unit_price: 250000 }
        ]
      });

      // Synchronize with live backend if available
      useEffect(() => {
        fetch(`${API_BASE}/invoices/`)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && Array.isArray(data) && data.length > 0) {
              setInvoices(data);
            }
          })
          .catch(() => {});

        fetch(`${API_BASE}/analytics/summary`)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data) setStats(data);
          })
          .catch(() => {});

        fetch(`${API_BASE}/clients/`)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && Array.isArray(data) && data.length > 0) {
              setClients(data);
            }
          })
          .catch(() => {});
      }, []);

      const showToast = (message) => {
        setNotification(message);
        setTimeout(() => setNotification(null), 3000);
      };

      const handleAddItem = () => {
        setNewInvoice({
          ...newInvoice,
          items: [...newInvoice.items, { description: "", quantity: 1, unit_price: 0 }]
        });
      };

      const handleRemoveItem = (idx) => {
        if (newInvoice.items.length <= 1) return;
        setNewInvoice({
          ...newInvoice,
          items: newInvoice.items.filter((_, i) => i !== idx)
        });
      };

      const handleItemChange = (idx, field, value) => {
        const next = [...newInvoice.items];
        next[idx][field] = field === 'description' ? value : (parseFloat(value) || 0);
        setNewInvoice({ ...newInvoice, items: next });
      };

      const handleCreateInvoice = (e) => {
        e.preventDefault();
        const subtotal = newInvoice.items.reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
        const tax = Math.round(subtotal * newInvoice.tax_rate);
        const total = subtotal + tax;
        const clientObj = clients.find(c => c.id === parseInt(newInvoice.client_id)) || clients[0];

        const payload = {
          client_id: clientObj.id,
          due_date: new Date(newInvoice.due_date).toISOString(),
          currency: "PKR",
          tax_rate: newInvoice.tax_rate,
          notes: newInvoice.notes,
          items: newInvoice.items.map(i => ({
            description: i.description,
            quantity: i.quantity,
            unit_price: i.unit_price
          }))
        };

        // Post to backend
        fetch(`${API_BASE}/invoices/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(res => res.ok ? res.json() : null)
        .then(created => {
          if (created) {
            setInvoices([created, ...invoices]);
          } else {
            // Local fallback
            const localInv = {
              id: invoices.length + 1,
              invoice_number: `INV-2026-000${invoices.length + 1}`,
              client: clientObj,
              status: "ISSUED",
              issue_date: new Date().toISOString().split('T')[0],
              due_date: newInvoice.due_date,
              currency: "PKR",
              subtotal,
              tax_amount: tax,
              total_amount: total,
              notes: newInvoice.notes
            };
            setInvoices([localInv, ...invoices]);
          }
          setStats(prev => ({
            ...prev,
            total_invoices: prev.total_invoices + 1,
            total_outstanding: prev.total_outstanding + total,
            issued_count: prev.issued_count + 1
          }));
          setShowModal(false);
          showToast(`Invoice INV-2026-000${invoices.length + 1} generated successfully.`);
        })
        .catch(() => {
          setShowModal(false);
          showToast("Invoice saved to local ledger.");
        });
      };

      const markAsPaid = (id) => {
        fetch(`${API_BASE}/invoices/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'PAID' })
        })
        .finally(() => {
          setInvoices(invoices.map(inv => inv.id === id ? { ...inv, status: 'PAID' } : inv));
          showToast("Payment recorded and status updated to Paid.");
        });
      };

      // Filtering
      const filteredInvoices = invoices.filter(inv => {
        const matchesQuery = 
          inv.invoice_number.toLowerCase().includes(searchQuery.toLowerCase()) ||
          inv.client.company.toLowerCase().includes(searchQuery.toLowerCase()) ||
          inv.client.name.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesStatus = statusFilter === 'ALL' || inv.status === statusFilter;
        return matchesQuery && matchesStatus;
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Application Bar */}
          <header className="border-b border-zinc-800/80 bg-[#101218] px-6 py-3.5 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-6">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-md bg-zinc-800 border border-zinc-700/80 flex items-center justify-center font-bold text-white text-sm">
                    P
                  </div>
                  <span className="font-semibold text-white tracking-tight text-sm">PayFlow</span>
                </div>

                <nav className="flex items-center space-x-1">
                  <button 
                    onClick={() => setCurrentView('invoices')}
                    className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${
                      currentView === 'invoices' 
                        ? 'bg-zinc-800 text-white' 
                        : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50'
                    }`}>
                    Invoices
                  </button>
                  <button 
                    onClick={() => setCurrentView('clients')}
                    className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${
                      currentView === 'clients' 
                        ? 'bg-zinc-800 text-white' 
                        : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50'
                    }`}>
                    Clients
                  </button>
                </nav>
              </div>

              <div className="flex items-center gap-3">
                <a 
                  href="http://localhost:8000/docs" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="text-xs text-zinc-400 hover:text-zinc-200 px-3 py-1.5 rounded-md border border-zinc-800 hover:border-zinc-700 transition">
                  API Docs ↗
                </a>
                <button
                  onClick={() => setShowModal(true)}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3.5 py-1.5 rounded-md transition shadow-sm">
                  + New Invoice
                </button>
              </div>
            </div>
          </header>

          {/* Subheader / Summary KPIs */}
          <section className="border-b border-zinc-800/60 bg-[#0f1117] py-6 px-6">
            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="p-4 rounded-lg bg-[#141721] border border-zinc-800/80">
                <div className="text-xs font-medium text-zinc-400">Total Collected</div>
                <div className="text-xl font-semibold text-white mt-1 num">
                  PKR {stats.total_revenue.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                </div>
                <div className="text-[11px] text-emerald-400 mt-1">Settled payments</div>
              </div>

              <div className="p-4 rounded-lg bg-[#141721] border border-zinc-800/80">
                <div className="text-xs font-medium text-zinc-400">Outstanding Balance</div>
                <div className="text-xl font-semibold text-white mt-1 num">
                  PKR {stats.total_outstanding.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                </div>
                <div className="text-[11px] text-zinc-400 mt-1">Pending collection</div>
              </div>

              <div className="p-4 rounded-lg bg-[#141721] border border-zinc-800/80">
                <div className="text-xs font-medium text-zinc-400">Active Invoices</div>
                <div className="text-xl font-semibold text-white mt-1 num">
                  {stats.total_invoices}
                </div>
                <div className="text-[11px] text-zinc-400 mt-1">{stats.paid_count} paid • {stats.issued_count} pending</div>
              </div>

              <div className="p-4 rounded-lg bg-[#141721] border border-zinc-800/80">
                <div className="text-xs font-medium text-zinc-400">Overdue</div>
                <div className="text-xl font-semibold text-rose-400 mt-1 num">
                  {stats.overdue_count}
                </div>
                <div className="text-[11px] text-rose-400/80 mt-1">Requires follow-up</div>
              </div>
            </div>
          </section>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-6">
            {currentView === 'invoices' && (
              <div>
                {/* Search & Filter Toolbar */}
                <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-4">
                  <div className="flex items-center gap-2 flex-1 max-w-md">
                    <input
                      type="text"
                      placeholder="Search by invoice number or client..."
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="w-full bg-[#141721] border border-zinc-800 rounded-md px-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition"
                    />
                  </div>

                  <div className="flex items-center gap-1.5 self-start sm:self-auto">
                    {['ALL', 'ISSUED', 'PAID', 'OVERDUE'].map(status => (
                      <button
                        key={status}
                        onClick={() => setStatusFilter(status)}
                        className={`px-2.5 py-1 rounded text-xs font-medium transition ${
                          statusFilter === status 
                            ? 'bg-zinc-800 text-white' 
                            : 'text-zinc-400 hover:text-zinc-200'
                        }`}>
                        {status === 'ALL' ? 'All' : status.charAt(0) + status.slice(1).toLowerCase()}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Invoices Table */}
                <div className="rounded-lg border border-zinc-800/80 bg-[#12141c] overflow-hidden">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-zinc-800 bg-[#161924] text-zinc-400 font-medium">
                        <th className="py-3 px-4">Invoice</th>
                        <th className="py-3 px-4">Client</th>
                        <th className="py-3 px-4">Issue Date</th>
                        <th className="py-3 px-4">Due Date</th>
                        <th className="py-3 px-4 text-right">Amount</th>
                        <th className="py-3 px-4">Status</th>
                        <th className="py-3 px-4 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-800/60">
                      {filteredInvoices.length === 0 ? (
                        <tr>
                          <td colSpan="7" className="py-8 text-center text-zinc-500">
                            No invoices found matching your criteria.
                          </td>
                        </tr>
                      ) : (
                        filteredInvoices.map(inv => (
                          <tr key={inv.id} className="hover:bg-zinc-800/30 transition">
                            <td className="py-3.5 px-4 font-mono font-medium text-white">
                              {inv.invoice_number}
                            </td>
                            <td className="py-3.5 px-4">
                              <div className="font-medium text-zinc-200">{inv.client.company}</div>
                              <div className="text-[11px] text-zinc-500">{inv.client.name}</div>
                            </td>
                            <td className="py-3.5 px-4 text-zinc-400 num">
                              {inv.issue_date.slice(0, 10)}
                            </td>
                            <td className="py-3.5 px-4 text-zinc-400 num">
                              {inv.due_date.slice(0, 10)}
                            </td>
                            <td className="py-3.5 px-4 text-right font-medium text-white num">
                              PKR {inv.total_amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                            </td>
                            <td className="py-3.5 px-4">
                              <span className={`inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium ${
                                inv.status === 'PAID'
                                  ? 'bg-emerald-950/50 text-emerald-400 border border-emerald-800/60'
                                  : inv.status === 'OVERDUE'
                                  ? 'bg-rose-950/50 text-rose-400 border border-rose-800/60'
                                  : 'bg-zinc-800 text-zinc-300 border border-zinc-700/60'
                              }`}>
                                {inv.status === 'PAID' && <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5"></span>}
                                {inv.status === 'OVERDUE' && <span className="w-1.5 h-1.5 rounded-full bg-rose-400 mr-1.5"></span>}
                                {inv.status === 'ISSUED' && <span className="w-1.5 h-1.5 rounded-full bg-amber-400 mr-1.5"></span>}
                                {inv.status}
                              </span>
                            </td>
                            <td className="py-3.5 px-4 text-right space-x-2">
                              {inv.status !== 'PAID' && (
                                <button
                                  onClick={() => markAsPaid(inv.id)}
                                  className="text-[11px] font-medium text-zinc-400 hover:text-white px-2 py-1 rounded hover:bg-zinc-800 transition">
                                  Mark as Paid
                                </button>
                              )}
                              <a
                                href={`http://localhost:8000/api/v1/invoices/${inv.id}/pdf`}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-block text-[11px] font-medium text-indigo-400 hover:text-indigo-300 px-2 py-1 rounded hover:bg-zinc-800 transition">
                                Download PDF
                              </a>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {currentView === 'clients' && (
              <div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {clients.map(c => (
                    <div key={c.id} className="p-4 rounded-lg bg-[#12141c] border border-zinc-800/80">
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="font-semibold text-white text-sm">{c.company}</div>
                          <div className="text-xs text-zinc-400 mt-0.5">{c.name}</div>
                        </div>
                        <span className="text-[11px] text-zinc-400 font-mono px-2 py-0.5 rounded bg-zinc-800 border border-zinc-700">
                          {c.tax_id}
                        </span>
                      </div>
                      <div className="mt-3 text-xs text-zinc-400 space-y-1">
                        <div>Email: <span className="text-zinc-300">{c.email}</span></div>
                        <div>Phone: <span className="text-zinc-300">{c.phone}</span></div>
                        <div>Address: <span className="text-zinc-300">{c.address}</span></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* New Invoice Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#12141c] border border-zinc-800 rounded-lg max-w-lg w-full p-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3 mb-4">
                  <h3 className="font-semibold text-white text-sm">Create New Invoice</h3>
                  <button onClick={() => setShowModal(false)} className="text-zinc-500 hover:text-white text-sm">
                    ✕
                  </button>
                </div>

                <form onSubmit={handleCreateInvoice} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-zinc-400 mb-1 font-medium">Customer</label>
                    <select
                      value={newInvoice.client_id}
                      onChange={e => setNewInvoice({...newInvoice, client_id: e.target.value})}
                      className="w-full bg-[#181b26] border border-zinc-800 rounded-md px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-600">
                      {clients.map(c => (
                        <option key={c.id} value={c.id}>{c.company} — {c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-zinc-400 mb-1 font-medium">Payment Due Date</label>
                    <input
                      type="date"
                      value={newInvoice.due_date}
                      onChange={e => setNewInvoice({...newInvoice, due_date: e.target.value})}
                      className="w-full bg-[#181b26] border border-zinc-800 rounded-md px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-600"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-zinc-400 font-medium">Line Items</label>
                      <button
                        type="button"
                        onClick={handleAddItem}
                        className="text-indigo-400 hover:text-indigo-300 text-[11px]">
                        + Add Item
                      </button>
                    </div>

                    <div className="space-y-2">
                      {newInvoice.items.map((item, idx) => (
                        <div key={idx} className="flex gap-2 items-center">
                          <input
                            type="text"
                            placeholder="Description"
                            value={item.description}
                            onChange={e => handleItemChange(idx, 'description', e.target.value)}
                            required
                            className="flex-1 bg-[#181b26] border border-zinc-800 rounded px-2.5 py-1.5 text-zinc-200"
                          />
                          <input
                            type="number"
                            min="1"
                            placeholder="Qty"
                            value={item.quantity}
                            onChange={e => handleItemChange(idx, 'quantity', e.target.value)}
                            required
                            className="w-16 bg-[#181b26] border border-zinc-800 rounded px-2.5 py-1.5 text-zinc-200 text-center"
                          />
                          <input
                            type="number"
                            placeholder="Price (PKR)"
                            value={item.unit_price}
                            onChange={e => handleItemChange(idx, 'unit_price', e.target.value)}
                            required
                            className="w-28 bg-[#181b26] border border-zinc-800 rounded px-2.5 py-1.5 text-zinc-200 text-right"
                          />
                          {newInvoice.items.length > 1 && (
                            <button
                              type="button"
                              onClick={() => handleRemoveItem(idx)}
                              className="text-zinc-500 hover:text-rose-400 px-1">
                              ✕
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-zinc-400 mb-1 font-medium">Payment Notes / Remittance Terms</label>
                    <textarea
                      rows="2"
                      value={newInvoice.notes}
                      onChange={e => setNewInvoice({...newInvoice, notes: e.target.value})}
                      className="w-full bg-[#181b26] border border-zinc-800 rounded-md px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-600"
                    />
                  </div>

                  <div className="pt-2 border-t border-zinc-800 flex items-center justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-3.5 py-1.5 rounded-md border border-zinc-800 text-zinc-400 hover:text-white transition">
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition shadow-sm">
                      Create &amp; Issue
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Clean Toast Notification */}
          {notification && (
            <div className="fixed bottom-5 right-5 bg-zinc-900 border border-zinc-700 text-zinc-200 px-4 py-2.5 rounded-md shadow-xl text-xs font-medium z-50">
              {notification}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
