<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFlow — Enterprise Receivables &amp; Billing Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Marked.js for AI Markdown Formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'Fira Code', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
            },
            slate: {
              850: '#111622',
              900: '#0b0e14',
              950: '#07090e',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #080a0f;
      color: #f1f5f9;
      letter-spacing: -0.011em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    
    .tnum { font-feature-settings: 'tnum' on, 'cv05' on, 'zero' on; }

    /* Precision Grid Layout */
    .bg-grid-tech {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    }

    /* Drawer animation */
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .animate-drawer {
      animation: slideInRight 0.2s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b0e14; }
    ::-webkit-scrollbar-thumb { background: #272d3d; border-radius: 0px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4256; }
  </style>
</head>
<body class="min-h-screen bg-[#080a0f] text-slate-100 bg-grid-tech selection:bg-blue-600/30 selection:text-blue-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const API_BASE = "http://localhost:8000/api/v1";

    // ==========================================
    // ACTUAL AUTHENTIC CORPORATE VECTOR LOGOS
    // ==========================================
    
    // Systems Limited Logo (Pakistan's Premier IT Giant)
    const SystemsLogo = ({ className = "w-7 h-7" }) => (
      <svg className={className} viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" fill="#0c1322" stroke="#1d4ed8" strokeWidth="1" />
        <path d="M10 24L18 10L26 10L18 24H10Z" fill="#0284c7" />
        <path d="M18 26L26 12H21L13 26H18Z" fill="#38bdf8" />
        <circle cx="13" cy="13" r="2.2" fill="#38bdf8" />
      </svg>
    );

    // Jazz Telecom (PMCL) Logo (Pakistan's Largest Telco)
    const JazzLogo = ({ className = "w-7 h-7" }) => (
      <svg className={className} viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" fill="#180c10" stroke="#dc2626" strokeWidth="1" />
        <path d="M12 25V21C12 17 15 16 19 16V12C11 12 8 17 8 21V25H12Z" fill="#facc15" />
        <path d="M18 25C22.4 25 26 21.4 26 17C26 10 19 8.5 19 8.5C19 8.5 22 11.5 22 15C22 18 20 20 17 20V25H18Z" fill="#e11d48" />
        <circle cx="19" cy="8.5" r="2" fill="#facc15" />
      </svg>
    );

    // Arbisoft Technologies Logo (Global Engineering Partner)
    const ArbisoftLogo = ({ className = "w-7 h-7" }) => (
      <svg className={className} viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" fill="#140f1a" stroke="#7c3aed" strokeWidth="1" />
        <path d="M18 8L27 13.5V23.5L18 29L9 23.5V13.5L18 8Z" stroke="#e11d48" strokeWidth="1.5" fill="none" />
        <path d="M18 8V18L27 23.5" stroke="#9333ea" strokeWidth="1.5" />
        <path d="M18 18L9 23.5" stroke="#38bdf8" strokeWidth="1.5" />
        <circle cx="18" cy="18" r="2" fill="#ffffff" />
      </svg>
    );

    // 10Pearls Pakistan Logo (Leading Digital Engineering)
    const TenPearlsLogo = ({ className = "w-7 h-7" }) => (
      <svg className={className} viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" fill="#081414" stroke="#059669" strokeWidth="1" />
        <circle cx="14" cy="18" r="6.5" stroke="#10b981" strokeWidth="2" fill="none" />
        <circle cx="22" cy="18" r="6.5" stroke="#06b6d4" strokeWidth="2" fill="none" />
        <circle cx="18" cy="18" r="1.8" fill="#a7f3d0" />
      </svg>
    );

    // Generic Corporate Logo Fallback
    const GenericCompanyLogo = ({ className = "w-7 h-7" }) => (
      <svg className={className} viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" fill="#111622" stroke="#334155" strokeWidth="1" />
        <rect x="10" y="10" width="16" height="16" stroke="#94a3b8" strokeWidth="1.5" fill="none" />
        <path d="M10 18H26M18 10V26" stroke="#94a3b8" strokeWidth="1.5" />
      </svg>
    );

    // Matcher function to return the real company logo
    const getCompanyLogo = (companyName) => {
      const name = (companyName || '').toLowerCase();
      if (name.includes('systems')) return <SystemsLogo />;
      if (name.includes('jazz')) return <JazzLogo />;
      if (name.includes('arbisoft')) return <ArbisoftLogo />;
      if (name.includes('10pearls') || name.includes('tenpearls')) return <TenPearlsLogo />;
      return <GenericCompanyLogo />;
    };

    // ==========================================
    // AUTHENTIC OAUTH IDENTITY LOGOS
    // ==========================================
    const GoogleLogo = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43-.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05" />
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335" />
      </svg>
    );

    const MicrosoftLogo = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="9.5" height="9.5" fill="#F25022" />
        <rect x="12.5" y="2" width="9.5" height="9.5" fill="#7FBA00" />
        <rect x="2" y="12.5" width="9.5" height="9.5" fill="#00A4EF" />
        <rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#FFB900" />
      </svg>
    );

    const PayFlowBrandmark = ({ size = 32 }) => (
      <div style={{ width: size, height: size }} className="rounded-none overflow-hidden flex items-center justify-center bg-[#0d1222] border border-indigo-500/50 shadow-sm shrink-0">
        <svg viewBox="0 0 40 40" width={size * 0.85} height={size * 0.85} fill="none">
          <defs>
            <linearGradient id="pf-sso-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#4f46e5" />
              <stop offset="100%" stopColor="#2563eb" />
            </linearGradient>
            <linearGradient id="pf-sso-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stopColor="#38bdf8" />
              <stop offset="100%" stopColor="#818cf8" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="36" height="36" fill="url(#pf-sso-bg)" stroke="#6366f1" strokeWidth="1" />
          <rect x="11" y="10" width="4.5" height="20" rx="1" fill="#ffffff" />
          <path d="M15.5 10H22.5C25.5376 10 28 12.4624 28 15.5C28 18.5376 25.5376 21 22.5 21H15.5V10Z" fill="#ffffff" />
          <path d="M15.5 14H21.5C22.6046 14 23.5 14.8954 23.5 16C23.5 17.1046 22.6046 18 21.5 18H15.5V14Z" fill="#1e1b4b" />
          <path d="M18 24H24C25.6569 24 27 25.3431 27 27C27 28.6569 25.6569 30 24 30H20" stroke="url(#pf-sso-cyan)" strokeWidth="2.2" strokeLinecap="round" />
          <circle cx="18.5" cy="30" r="1.2" fill="#38bdf8" />
        </svg>
      </div>
    );

    // ==========================================
    // ENTERPRISE LOGIN GATEWAY COMPONENT
    // ==========================================
    function LoginScreen({ onLoginSuccess, isBackendConnected }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState(null);
      const [ssoModal, setSsoModal] = useState(null); // { provider: 'google' | 'microsoft', name: string }
      const [ssoEmail, setSsoEmail] = useState('');
      const [ssoLoading, setSsoLoading] = useState(false);
      const [ssoError, setSsoError] = useState(null);

      // Pre-provisioned Corporate Accounts for 1-Click Verification
      const enterpriseDemoAccounts = [
        { label: "Admin Controller", email: "admin@payflow.pk", role: "ADMIN", pass: "Admin@123456", org: "PayFlow HQ Controller" },
        { label: "Systems Limited (Client)", email: "accounts@systemsltd.com", role: "CLIENT", pass: "Client@123456", org: "Systems Limited" },
        { label: "Jazz Telecom (Client)", email: "procurement@jazz.com.pk", role: "CLIENT", pass: "Client@123456", org: "Jazz Telecom (PMCL)" },
        { label: "Arbisoft (Client)", email: "billing@arbisoft.com", role: "CLIENT", pass: "Client@123456", org: "Arbisoft Technologies" },
        { label: "10Pearls (Client)", email: "finance.pk@10pearls.com", role: "CLIENT", pass: "Client@123456", org: "10Pearls Pakistan" }
      ];

      // Handle standard corporate password authentication
      const handleDirectLogin = async (e) => {
        if (e) e.preventDefault();
        setIsLoading(true);
        setErrorMessage(null);

        try {
          const res = await fetch(`${API_BASE}/auth/login-json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), password: password.trim() })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || "Authentication failed. Check your corporate credentials.");
          }

          onLoginSuccess(data.user, data.access_token);
        } catch (err) {
          setErrorMessage(err.message);
        } finally {
          setIsLoading(false);
        }
      };

      // Handle SSO OAuth Login (Google / Outlook / Hotmail)
      const executeSSOAuth = async (provider, targetEmail) => {
        setSsoLoading(true);
        setSsoError(null);

        try {
          const res = await fetch(`${API_BASE}/auth/oauth/sso`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: provider,
              email: targetEmail.trim()
            })
          });

          const data = await res.json();
          if (!res.ok) {
            // Strict corporate policy rejection (e.g. self-registration disabled)
            throw new Error(data.detail || "SSO Authentication rejected by enterprise security policy.");
          }

          onLoginSuccess(data.user, data.access_token);
        } catch (err) {
          setSsoError(err.message);
        } finally {
          setSsoLoading(false);
        }
      };

      const openSSODialog = (provider) => {
        setSsoError(null);
        setSsoEmail('');
        setSsoModal({
          provider: provider,
          name: provider === 'google' ? 'Google Workspace / Gmail' : 'Microsoft 365 / Outlook / Hotmail'
        });
      };

      const selectDemoProfile = (acc) => {
        setEmail(acc.email);
        setPassword(acc.pass);
        setErrorMessage(null);
      };

      return (
        <div className="min-h-screen bg-[#080a0f] text-slate-100 flex flex-col justify-between bg-grid-tech selection:bg-blue-600/30 selection:text-blue-200">
          
          {/* Top Brand Bar */}
          <header className="border-b border-slate-800 bg-[#0d1017] px-6 py-3.5">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <PayFlowBrandmark size={32} />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-white text-base tracking-tight font-sans">
                      Pay<span className="text-sky-400">Flow</span>
                    </span>
                    <span className="text-[10px] font-mono uppercase px-1.5 py-0.2 rounded-none bg-slate-800 text-slate-300 border border-slate-700">
                      ENTERPRISE GATEWAY
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-400 font-sans tracking-tight">
                    Next-Gen Invoicing &amp; Cash Velocity Engine
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-3 font-mono text-xs">
                <div className="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-none bg-slate-900 border border-slate-800 text-[11px]">
                  <span className={`w-2 h-2 rounded-none ${isBackendConnected ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                  <span className={isBackendConnected ? 'text-emerald-400 font-semibold' : 'text-amber-400'}>
                    {isBackendConnected ? 'ENGINE LIVE (:8000)' : 'ENGINE RECONNECTING'}
                  </span>
                </div>
                <a 
                  href="/client-portal-vue/index.html" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="text-xs text-blue-400 hover:text-blue-300 px-2.5 py-1 rounded-none border border-blue-900/60 bg-blue-950/20 transition flex items-center gap-1">
                  <span>COUNTERPARTY PORTAL</span>
                  <span>↗</span>
                </a>
              </div>
            </div>
          </header>

          {/* Main Login Centerpiece */}
          <main className="flex-1 flex items-center justify-center p-4 sm:p-6 my-6">
            <div className="max-w-lg w-full bg-[#0c1018] border border-slate-700 rounded-none shadow-2xl relative">
              
              {/* Precision Top Accent Line */}
              <div className="h-1 w-full bg-gradient-to-r from-blue-600 via-indigo-500 to-sky-400"></div>

              <div className="p-6 sm:p-8">
                
                {/* Gateway Heading */}
                <div className="text-center mb-6">
                  <div className="inline-flex items-center justify-center mb-3">
                    <PayFlowBrandmark size={44} />
                  </div>
                  <h1 className="text-xl sm:text-2xl font-bold font-sans tracking-tight text-white uppercase">
                    PayFlow Access Gateway
                  </h1>
                  <p className="text-xs text-slate-400 mt-1 font-sans">
                    Unified Authentication for Corporate Administrators &amp; Counterparty Clients
                  </p>
                </div>

                {/* Error Banner */}
                {errorMessage && (
                  <div className="mb-5 p-3 rounded-none bg-rose-950/40 border border-rose-800/80 text-rose-300 text-xs font-mono flex items-start gap-2.5">
                    <span className="w-4 h-4 rounded-none bg-rose-800 text-white flex items-center justify-center font-bold text-[10px] shrink-0 mt-0.5">!</span>
                    <div className="flex-1 leading-relaxed">
                      {errorMessage}
                    </div>
                  </div>
                )}

                {/* ========================================================
                    SSO / OAUTH 2.0 INTEGRATION BUTTONS (Gmail & Outlook)
                   ======================================================== */}
                <div className="space-y-2.5 mb-6">
                  {/* Google Workspace / Gmail SSO */}
                  <button
                    type="button"
                    onClick={() => openSSODialog('google')}
                    className="w-full flex items-center justify-between px-4 py-3 bg-[#111624] hover:bg-[#182034] text-white border border-slate-700 hover:border-blue-500 transition rounded-none font-sans text-xs font-medium group">
                    <div className="flex items-center gap-3">
                      <div className="p-1 bg-white rounded-none shrink-0 flex items-center justify-center">
                        <GoogleLogo className="w-4 h-4" />
                      </div>
                      <span className="font-semibold text-slate-200 group-hover:text-white">
                        Sign in with Google Workspace (Gmail)
                      </span>
                    </div>
                    <span className="text-[10px] font-mono text-slate-400 uppercase tracking-wider px-1.5 py-0.5 bg-slate-800 border border-slate-700">
                      GOOGLE SSO
                    </span>
                  </button>

                  {/* Microsoft 365 / Outlook / Hotmail SSO */}
                  <button
                    type="button"
                    onClick={() => openSSODialog('microsoft')}
                    className="w-full flex items-center justify-between px-4 py-3 bg-[#111624] hover:bg-[#182034] text-white border border-slate-700 hover:border-sky-500 transition rounded-none font-sans text-xs font-medium group">
                    <div className="flex items-center gap-3">
                      <div className="p-1 bg-[#1a1f2e] border border-slate-700 rounded-none shrink-0 flex items-center justify-center">
                        <MicrosoftLogo className="w-4 h-4" />
                      </div>
                      <span className="font-semibold text-slate-200 group-hover:text-white">
                        Sign in with Microsoft 365 (Outlook / Hotmail)
                      </span>
                    </div>
                    <span className="text-[10px] font-mono text-slate-400 uppercase tracking-wider px-1.5 py-0.5 bg-slate-800 border border-slate-700">
                      MICROSOFT SSO
                    </span>
                  </button>
                </div>

                {/* Squared Divider */}
                <div className="relative my-6 text-center">
                  <div className="absolute inset-0 flex items-center">
                    <div className="w-full border-t border-slate-800"></div>
                  </div>
                  <span className="relative bg-[#0c1018] px-3 font-mono text-[10px] text-slate-500 uppercase tracking-widest">
                    OR CORPORATE CREDENTIALS
                  </span>
                </div>

                {/* Direct Corporate Password Form */}
                <form onSubmit={handleDirectLogin} className="space-y-4">
                  <div>
                    <label className="block text-slate-300 text-xs font-mono uppercase tracking-wider mb-1.5 font-semibold">
                      ENTERPRISE WORK EMAIL / ID
                    </label>
                    <input
                      type="email"
                      required
                      placeholder="admin@payflow.pk or client@company.com"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="w-full bg-[#111520] border border-slate-700 rounded-none px-3.5 py-2.5 text-white font-mono text-xs focus:border-blue-500 focus:outline-none transition"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="block text-slate-300 text-xs font-mono uppercase tracking-wider font-semibold">
                        SECURITY PASSWORD
                      </label>
                      <span className="text-[10px] font-mono text-slate-500">
                        AES-256 HASHED
                      </span>
                    </div>
                    <input
                      type="password"
                      required
                      placeholder="••••••••••••"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full bg-[#111520] border border-slate-700 rounded-none px-3.5 py-2.5 text-white font-mono text-xs focus:border-blue-500 focus:outline-none transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={isLoading}
                    className="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-blue-800 text-white font-mono font-bold text-xs tracking-wider py-2.5 px-4 rounded-none border border-blue-400/40 transition flex items-center justify-center gap-2">
                    {isLoading ? (
                      <>
                        <span className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-none animate-spin"></span>
                        <span>VERIFYING CREDENTIALS...</span>
                      </>
                    ) : (
                      <>
                        <span>AUTHENTICATE ENTERPRISE SESSION</span>
                        <span>&rarr;</span>
                      </>
                    )}
                  </button>
                </form>

                {/* ========================================================
                    STRICT REGISTRATION RESTRICTION NOTICE (NO SIGN UP)
                   ======================================================== */}
                <div className="mt-6 border border-amber-800/80 bg-[#16120b] p-3.5 text-xs font-mono rounded-none">
                  <div className="flex items-center justify-between pb-1 mb-1.5 border-b border-amber-900/60 text-amber-400 font-bold">
                    <div className="flex items-center gap-1.5 text-[11px] uppercase tracking-wider">
                      <span className="w-1.5 h-1.5 bg-amber-400"></span>
                      <span>SELF-REGISTRATION STRICTLY DISABLED</span>
                    </div>
                    <span className="text-[9px] px-1 py-0.2 bg-amber-950 text-amber-300 border border-amber-700/60 uppercase">
                      POLICY ENFORCED
                    </span>
                  </div>
                  <p className="text-slate-300 text-[11px] leading-relaxed font-sans">
                    Public sign-up is not allowed under PayFlow security compliance. Client counterparties and executive operators are provisioned exclusively by enterprise administration.
                  </p>
                  <div className="mt-2 text-slate-300 text-[11px] font-sans flex flex-wrap items-center gap-1.5">
                    <span>To register or provision new enterprise access, contact:</span>
                    <a 
                      href="mailto:admin@payflow.pk" 
                      className="text-sky-400 hover:text-sky-300 underline font-mono font-bold">
                      admin@payflow.pk
                    </a>
                  </div>
                </div>

                {/* Pre-configured Demo Accounts / 1-Click Fill Drawer */}
                <div className="mt-5 pt-4 border-t border-slate-800">
                  <div className="flex items-center justify-between mb-2">

    function renderMarkdown(content) {
      if (!content) return { __html: '' };
      try {
        if (window.marked && typeof window.marked.parse === 'function') {
          return { __html: window.marked.parse(content) };
        }
      } catch (e) {}
      let html = content
        .replace(/^### (.*$)/gim, '<h3 class="text-xs font-bold text-white uppercase font-mono mt-2 mb-1 text-sky-400">$1</h3>')
        .replace(/^## (.*$)/gim, '<h2 class="text-sm font-bold text-white uppercase font-mono mt-2 mb-1 text-sky-300">$1</h2>')
        .replace(/^# (.*$)/gim, '<h1 class="text-base font-bold text-white uppercase font-mono mt-3 mb-1">$1</h1>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong class="text-white font-semibold">$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em class="text-slate-300">$1</em>')
        .replace(/`([^`]+)`/gim, '<code class="bg-[#111624] text-sky-300 px-1 py-0.5 rounded-none font-mono text-[11px] border border-slate-700">$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 underline font-semibold font-mono">$1 ↗</a>')
        .replace(/^\- (.*$)/gim, '<li class="ml-4 list-disc text-slate-300 text-xs my-0.5">$1</li>')
        .replace(/\n/gim, '<br />');
      return { __html: html };
    }

          {/* ========================================================
              GEMINI API KEY CONFIGURATION MODAL
             ======================================================== */}
          {showGeminiConfigModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="max-w-md w-full bg-[#0d121c] border border-slate-700 rounded-none shadow-2xl p-6 relative">
                
                <div className="flex items-start justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">🤖</span>
                    <div>
                      <h3 className="text-sm font-bold text-white uppercase font-sans">
                        Configure Google Gemini AI
                      </h3>
                      <p className="text-[11px] text-slate-400 font-mono">
                        Native Tool Calling &bull; gemini-2.5-flash
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowGeminiConfigModal(false)}
                    className="text-slate-400 hover:text-white font-mono text-base p-1">
                    ✕
                  </button>
                </div>

                <div className="py-4 space-y-4 text-xs font-sans">
                  <p className="text-slate-300 leading-relaxed">
                    Provide your <strong>Google Gemini API Key</strong> to activate PayBot's native multi-turn reasoning and automated function calling against your corporate ledger.
                  </p>

                  <div className="p-3 bg-blue-950/30 border border-blue-900/60 rounded-none text-blue-200 text-[11px] leading-relaxed">
                    Don't have a key? Generate a free API key instantly at{' '}
                    <a 
                      href="https://aistudio.google.com/app/apikey" 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="text-sky-400 underline font-semibold">
                      Google AI Studio ↗
                    </a>.
                  </div>

                  <div>
                    <label className="block text-slate-300 font-mono text-[11px] uppercase tracking-wider mb-1.5 font-semibold">
                      GEMINI API KEY (AIzaSy...)
                    </label>
                    <input
                      type="password"
                      value={geminiInputKey}
                      onChange={(e) => setGeminiInputKey(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full bg-[#111520] border border-slate-700 rounded-none px-3 py-2 text-white font-mono text-xs focus:border-blue-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center justify-between pt-2 border-t border-slate-800 font-mono text-xs">
                    <button
                      type="button"
                      onClick={() => {
                        setGeminiInputKey('');
                        saveGeminiKey('');
                      }}
                      className="text-rose-400 hover:text-rose-300 underline">
                      CLEAR KEY
                    </button>

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setShowGeminiConfigModal(false)}
                        className="px-3 py-1.5 border border-slate-700 text-slate-400 hover:text-white">
                        CANCEL
                      </button>
                      <button
                        type="button"
                        onClick={() => saveGeminiKey(geminiInputKey)}
                        className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold border border-blue-400/40">
                        SAVE &amp; ACTIVATE
                      </button>
                    </div>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
