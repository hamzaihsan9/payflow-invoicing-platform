<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFlow — Enterprise Receivables &amp; Billing Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#4f46e5',
              600: '#4338ca',
              700: '#3730a3',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #090a0f;
      color: #f4f4f5;
      letter-spacing: -0.012em;
    }
    .tnum { font-feature-settings: 'tnum' on, 'cv05' on; }
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090a0f; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="min-h-screen bg-[#090a0f] text-zinc-100 antialiased selection:bg-indigo-600/30 selection:text-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const API_BASE = "http://localhost:8000/api/v1";

    function App() {
      const [currentTab, setCurrentTab] = useState('invoices');
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [notification, setNotification] = useState(null);
      const [isBackendConnected, setIsBackendConnected] = useState(false);

      // Financial Metrics
      const [stats, setStats] = useState({
        total_revenue: 870000,
        total_outstanding: 1624000,
        total_invoices: 3,
        paid_count: 1,
        issued_count: 1,
        overdue_count: 1
      });

      // Invoices
      const [invoices, setInvoices] = useState([
        {
          id: 1,
          invoice_number: "INV-2026-0001",
          client: { id: 1, company: "Systems Limited", name: "Asif Peer", email: "accounts@systemsltd.com", tax_id: "NTN-0814920-1", address: "DHA Phase 1, Lahore" },
          status: "PAID",
          issue_date: "2026-09-20",
          due_date: "2026-10-05",
          currency: "PKR",
          subtotal: 750000,
          tax_rate: 0.16,
          tax_amount: 120000,
          total_amount: 870000,
          notes: "Quarterly Kubernetes Cluster & FastAPI Microservice Architecture Consultation",
          items: [
            { description: "Microservice Engineering (Sprints 1-4)", quantity: 4, unit_price: 150000, total: 600000 },
            { description: "High-Availability Redis & DB Clustering", quantity: 1, unit_price: 150000, total: 150000 }
          ]
        },
        {
          id: 2,
          invoice_number: "INV-2026-0002",
          client: { id: 2, company: "Jazz Telecom (PMCL)", name: "Aamir Ibrahim", email: "procurement@jazz.com.pk", tax_id: "NTN-0710123-4", address: "Jazz HQ, G-8/4, Islamabad" },
          status: "ISSUED",
          issue_date: "2026-10-05",
          due_date: "2026-10-25",
          currency: "PKR",
          subtotal: 480000,
          tax_rate: 0.16,
          tax_amount: 76800,
          total_amount: 556800,
          notes: "Self-Service Customer Settlement Portal & Event Engine Integration",
          items: [
            { description: "Vue 3 Settlement Portal Implementation", quantity: 1, unit_price: 280000, total: 280000 },
            { description: "Node.js Webhook Event Bus Architecture", quantity: 1, unit_price: 200000, total: 200000 }
          ]
        },
        {
          id: 3,
          invoice_number: "INV-2026-0003",
          client: { id: 3, company: "Arbisoft Technologies", name: "Yasser Bashir", email: "billing@arbisoft.com", tax_id: "NTN-2938472-8", address: "Canal Bank Road, Lahore" },
          status: "OVERDUE",
          issue_date: "2026-08-30",
          due_date: "2026-09-30",
          currency: "PKR",
          subtotal: 920000,
          tax_rate: 0.16,
          tax_amount: 147200,
          total_amount: 1067200,
          notes: "Distributed NLP Data Pipeline & High-Throughput Model Inference Services",
          items: [
            { description: "Model Inference Acceleration & Caching Layer", quantity: 2, unit_price: 360000, total: 720000 },
            { description: "Docker Infrastructure & Load Balancing", quantity: 1, unit_price: 200000, total: 200000 }
          ]
        }
      ]);

      // Corporate Clients
      const [clients, setClients] = useState([
        { id: 1, company: "Systems Limited", name: "Asif Peer", email: "accounts@systemsltd.com", phone: "+92 42 111-797-836", tax_id: "NTN-0814920-1", address: "E-5, CCA, DHA Phase 1, Lahore" },
        { id: 2, company: "Jazz Telecom (PMCL)", name: "Aamir Ibrahim", email: "procurement@jazz.com.pk", phone: "+92 51 111-300-300", tax_id: "NTN-0710123-4", address: "Jazz HQ, G-8/4, Islamabad" },
        { id: 3, company: "Arbisoft Technologies", name: "Yasser Bashir", email: "billing@arbisoft.com", phone: "+92 42 3595-4601", tax_id: "NTN-2938472-8", address: "25 Canal Bank Road, Lahore" },
        { id: 4, company: "10Pearls Pakistan", name: "Zeeshan Aftab", email: "finance.pk@10pearls.com", phone: "+92 21 3432-8571", tax_id: "NTN-3849102-5", address: "PECHS Block 6, Shahrah-e-Faisal, Karachi" }
      ]);

      // Audit Logs
      const [auditLogs, setAuditLogs] = useState([
        { id: 101, action: "INVOICE_ISSUED", resource_type: "INVOICE", resource_id: "3", details: "Issued invoice INV-2026-0003 for PKR 1,067,200.00 to Arbisoft Technologies", timestamp: "2026-08-30T10:15:00", user_email: "hamza@payflow.pk" },
        { id: 102, action: "PAYMENT_RECORDED", resource_type: "INVOICE", resource_id: "1", details: "Confirmed full payment PKR 870,000.00 via RAAST IBFT from Systems Limited", timestamp: "2026-09-22T14:40:00", user_email: "hamza@payflow.pk" },
        { id: 103, action: "INVOICE_ISSUED", resource_type: "INVOICE", resource_id: "2", details: "Dispatched billing notification & PDF for INV-2026-0002 to Jazz Telecom", timestamp: "2026-10-05T09:30:00", user_email: "hamza@payflow.pk" }
      ]);

      // Form State for New Invoice
      const [formData, setFormData] = useState({
        client_id: 1,
        due_date: "2026-11-15",
        tax_rate: 0.16,
        notes: "Payment Terms: Net 30 days. Remittance via RAAST Instant Transfer or HBL IBFT.",
        items: [
          { description: "Software Architecture & Backend Engineering Support", quantity: 1, unit_price: 350000 }
        ]
      });

      // Synchronize live data from backend API
      const refreshData = () => {
        fetch(`${API_BASE}/invoices/`)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && Array.isArray(data) && data.length > 0) {
              setInvoices(data);
              setIsBackendConnected(true);
            }
          })
          .catch(() => setIsBackendConnected(false));

        fetch(`${API_BASE}/analytics/summary`)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data) setStats(data);
          })
          .catch(() => {});

        fetch(`${API_BASE}/clients/`)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && Array.isArray(data) && data.length > 0) {
              setClients(data);
            }
          })
          .catch(() => {});

        fetch(`${API_BASE}/audit/`)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && Array.isArray(data) && data.length > 0) {
              setAuditLogs(data);
            }
          })
          .catch(() => {});
      };

      useEffect(() => {
        refreshData();
      }, []);

      const showToast = (msg, type = "success") => {
        setNotification({ text: msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      // Create Invoice handler
      const handleCreateInvoice = (e) => {
        e.preventDefault();
        const subtotal = formData.items.reduce((s, it) => s + (it.quantity * it.unit_price), 0);
        const tax_amount = Math.round(subtotal * formData.tax_rate);
        const total_amount = subtotal + tax_amount;
        const clientObj = clients.find(c => c.id === parseInt(formData.client_id)) || clients[0];

        const payload = {
          client_id: clientObj.id,
          due_date: new Date(formData.due_date).toISOString(),
          currency: "PKR",
          tax_rate: formData.tax_rate,
          notes: formData.notes,
          items: formData.items.map(it => ({
            description: it.description,
            quantity: it.quantity,
            unit_price: it.unit_price
          }))
        };

        fetch(`${API_BASE}/invoices/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(res => {
          if (res.ok) return res.json();
          throw new Error("Backend save failed");
        })
        .then(created => {
          setInvoices([created, ...invoices]);
          setShowCreateModal(false);
          showToast(`Invoice ${created.invoice_number} generated and logged.`);
          refreshData();
        })
        .catch(() => {
          // Local fallback
          const localInv = {
            id: invoices.length + 1,
            invoice_number: `INV-2026-000${invoices.length + 1}`,
            client: clientObj,
            status: "ISSUED",
            issue_date: new Date().toISOString().split('T')[0],
            due_date: formData.due_date,
            currency: "PKR",
            subtotal,
            tax_rate: formData.tax_rate,
            tax_amount,
            total_amount,
            notes: formData.notes,
            items: formData.items.map(i => ({ ...i, total: i.quantity * i.unit_price }))
          };
          setInvoices([localInv, ...invoices]);
          setShowCreateModal(false);
          showToast(`Invoice ${localInv.invoice_number} created locally.`);
        });
      };

      // Mark Invoice as Paid
      const handleMarkPaid = (inv) => {
        fetch(`${API_BASE}/invoices/${inv.id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'PAID' })
        })
        .then(res => {
          if (res.ok) return res.json();
          return null;
        })
        .finally(() => {
          setInvoices(invoices.map(i => i.id === inv.id ? { ...i, status: 'PAID' } : i));
          if (selectedInvoice && selectedInvoice.id === inv.id) {
            setSelectedInvoice({ ...selectedInvoice, status: 'PAID' });
          }
          showToast(`Invoice ${inv.invoice_number} settled. Payment reconciled.`);
          refreshData();
        });
      };

      // Item Management in Form
      const addItemRow = () => {
        setFormData({
          ...formData,
          items: [...formData.items, { description: "", quantity: 1, unit_price: 100000 }]
        });
      };

      const removeItemRow = (idx) => {
        if (formData.items.length <= 1) return;
        setFormData({
          ...formData,
          items: formData.items.filter((_, i) => i !== idx)
        });
      };

      const updateItem = (idx, field, val) => {
        const next = [...formData.items];
        next[idx][field] = field === 'description' ? val : (parseFloat(val) || 0);
        setFormData({ ...formData, items: next });
      };

      // Invoices Filtering
      const filteredInvoices = useMemo(() => {
        return invoices.filter(inv => {
          const q = searchQuery.toLowerCase().trim();
          const matchQuery = !q ||
            inv.invoice_number.toLowerCase().includes(q) ||
            inv.client.company.toLowerCase().includes(q) ||
            inv.client.name.toLowerCase().includes(q);
          const matchStatus = statusFilter === 'ALL' || inv.status === statusFilter;
          return matchQuery && matchStatus;
        });
      }, [invoices, searchQuery, statusFilter]);

      return (
        <div className="min-h-screen flex flex-col bg-[#090a0f] text-zinc-100">
          
          {/* Executive Top Navigation Bar */}
          <header className="border-b border-zinc-800/80 bg-[#10121a] px-6 py-3 sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              {/* Brand and Organization Scope */}
              <div className="flex items-center gap-6">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-md bg-indigo-600 flex items-center justify-center font-bold text-white text-sm shadow-sm shadow-indigo-500/20">
                    PF
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-semibold text-white tracking-tight text-sm">PayFlow</span>
                      <span className="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 border border-zinc-700/60">
                        Enterprise
                      </span>
                    </div>
                    <div className="text-[11px] text-zinc-400">
                      Hamza Ihsan Enterprises (Pvt) Ltd
                    </div>
                  </div>
                </div>

                {/* Primary Tabs */}
                <nav className="hidden md:flex items-center space-x-1 border-l border-zinc-800 pl-6">
                  <button 
                    onClick={() => setCurrentTab('invoices')}
                    className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${
                      currentTab === 'invoices' 
                        ? 'bg-zinc-800 text-white border border-zinc-700/60' 
                        : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40'
                    }`}>
                    Receivables Ledger
                  </button>
                  <button 
                    onClick={() => setCurrentTab('clients')}
                    className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${
                      currentTab === 'clients' 
                        ? 'bg-zinc-800 text-white border border-zinc-700/60' 
                        : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40'
                    }`}>
                    Client Directory
                  </button>
                  <button 
                    onClick={() => setCurrentTab('audit')}
                    className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${
                      currentTab === 'audit' 
                        ? 'bg-zinc-800 text-white border border-zinc-700/60' 
                        : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40'
                    }`}>
                    Compliance &amp; Audit Trail
                  </button>
                </nav>
              </div>

              {/* Status & Action Buttons */}
              <div className="flex items-center gap-3">
                <a 
                  href="http://localhost:8000/docs" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="hidden sm:inline-flex items-center gap-1.5 text-xs text-zinc-400 hover:text-zinc-200 px-3 py-1.5 rounded-md border border-zinc-800 hover:border-zinc-700 transition">
                  <span>FastAPI Docs</span>
                  <span className="text-[10px] text-zinc-500">↗</span>
                </a>

                <a 
                  href="file:///home/kali/Projects/payflow-invoicing-platform/client-portal-vue/index.html" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="hidden sm:inline-flex items-center gap-1.5 text-xs text-zinc-400 hover:text-zinc-200 px-3 py-1.5 rounded-md border border-zinc-800 hover:border-zinc-700 transition">
                  <span>Client Portal (Vue 3)</span>
                  <span className="text-[10px] text-zinc-500">↗</span>
                </a>

                <button
                  onClick={() => setShowCreateModal(true)}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3.5 py-1.5 rounded-md transition flex items-center gap-1.5 shadow-sm">
                  <span>+</span>
                  <span>Create Invoice</span>
                </button>

                {/* User Avatar */}
                <div className="flex items-center gap-2 pl-2 border-l border-zinc-800">
                  <div className="w-7 h-7 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-semibold text-zinc-300">
                    HI
                  </div>
                  <div className="hidden lg:block text-left">
                    <div className="text-xs font-medium text-zinc-200 leading-tight">Hamza Ihsan</div>
                    <div className="text-[10px] text-zinc-500">Finance Administrator</div>
                  </div>
                </div>
              </div>

            </div>
          </header>

          {/* KPI Summary Strip */}
          <section className="border-b border-zinc-800/80 bg-[#0d0f16] py-5 px-6">
            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              
              <div className="p-4 rounded-lg bg-[#12141f] border border-zinc-800">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-medium text-zinc-400">Total Billed Volume</span>
                  <span className="text-[10px] text-zinc-500 font-mono">Q3/Q4 FY26</span>
                </div>
                <div className="text-xl font-semibold text-white mt-1.5 tnum font-mono">
                  PKR {(stats.total_revenue + stats.total_outstanding).toLocaleString('en-US', { minimumFractionDigits: 2 })}
                </div>
                <div className="text-[11px] text-zinc-400 mt-1">
                  {stats.total_invoices} total corporate billings
                </div>
              </div>

              <div className="p-4 rounded-lg bg-[#12141f] border border-zinc-800">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-medium text-zinc-400">Settled Revenue</span>
                  <span className="text-[10px] text-emerald-400 font-medium bg-emerald-950/60 border border-emerald-800/60 px-1.5 py-0.2 rounded">
                    Reconciled
                  </span>
                </div>
                <div className="text-xl font-semibold text-white mt-1.5 tnum font-mono">
                  PKR {stats.total_revenue.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                </div>
                <div className="text-[11px] text-emerald-400/90 mt-1">
                  {stats.paid_count} settled via RAAST / 1Link
                </div>
              </div>

              <div className="p-4 rounded-lg bg-[#12141f] border border-zinc-800">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-medium text-zinc-400">Pending Receivables</span>
                  <span className="text-[10px] text-amber-400 font-medium bg-amber-950/60 border border-amber-800/60 px-1.5 py-0.2 rounded">
                    Awaiting Remittance
                  </span>
                </div>
                <div className="text-xl font-semibold text-white mt-1.5 tnum font-mono">
                  PKR {stats.total_outstanding.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                </div>
                <div className="text-[11px] text-zinc-400 mt-1">
                  {stats.issued_count + stats.overdue_count} invoices open
                </div>
              </div>

              <div className="p-4 rounded-lg bg-[#12141f] border border-zinc-800">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-medium text-zinc-400">Delinquent / Overdue</span>
                  <span className="text-[10px] text-rose-400 font-medium bg-rose-950/60 border border-rose-800/60 px-1.5 py-0.2 rounded">
                    Action Required
                  </span>
                </div>
                <div className="text-xl font-semibold text-rose-400 mt-1.5 tnum font-mono">
                  PKR {(stats.overdue_count > 0 ? 1067200 : 0).toLocaleString('en-US', { minimumFractionDigits: 2 })}
                </div>
                <div className="text-[11px] text-rose-400/80 mt-1">
                  {stats.overdue_count} invoice past Net-30 maturity
                </div>
              </div>

            </div>
          </section>

          {/* Main Dashboard Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-6">

            {/* TAB 1: Invoices Ledger */}
            {currentTab === 'invoices' && (
              <div>
                {/* Search & Filter Toolbar */}
                <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-4">
                  <div className="flex items-center gap-2 flex-1 max-w-md">
                    <div className="relative w-full">
                      <input
                        type="text"
                        placeholder="Search by invoice number, company, or contact..."
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        className="w-full bg-[#12141f] border border-zinc-800 rounded-md pl-9 pr-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition"
                      />
                      <svg className="w-3.5 h-3.5 absolute left-3 top-2.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                      </svg>
                    </div>
                  </div>

                  <div className="flex items-center gap-1.5 self-start sm:self-auto">
                    {[
                      { key: 'ALL', label: 'All Invoices' },
                      { key: 'PAID', label: 'Paid' },
                      { key: 'ISSUED', label: 'Pending Net-30' },
                      { key: 'OVERDUE', label: 'Overdue' }
                    ].map(st => (
                      <button
                        key={st.key}
                        onClick={() => setStatusFilter(st.key)}
                        className={`px-3 py-1 rounded-md text-xs font-medium transition ${
                          statusFilter === st.key 
                            ? 'bg-zinc-800 text-white border border-zinc-700/80' 
                            : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40'
                        }`}>
                        {st.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Invoices Table */}
                <div className="rounded-lg border border-zinc-800 bg-[#10121a] overflow-hidden shadow-sm">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-zinc-800 bg-[#131622] text-zinc-400 font-medium">
                          <th className="py-3 px-4">Invoice #</th>
                          <th className="py-3 px-4">Billed Counterparty</th>
                          <th className="py-3 px-4">Issue Date</th>
                          <th className="py-3 px-4">Payment Due</th>
                          <th className="py-3 px-4 text-right">Gross Total</th>
                          <th className="py-3 px-4">Status</th>
                          <th className="py-3 px-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-800/60">
                        {filteredInvoices.length === 0 ? (
                          <tr>
                            <td colSpan="7" className="py-10 text-center text-zinc-500">
                              No invoices found matching your criteria.
                            </td>
                          </tr>
                        ) : (
                          filteredInvoices.map(inv => (
                            <tr key={inv.id} className="hover:bg-zinc-800/30 transition">
                              
                              <td className="py-3.5 px-4 font-mono font-medium text-white">
                                <button 
                                  onClick={() => setSelectedInvoice(inv)}
                                  className="hover:underline text-indigo-400">
                                  {inv.invoice_number}
                                </button>
                              </td>

                              <td className="py-3.5 px-4">
                                <div className="font-medium text-zinc-200">{inv.client.company}</div>
                                <div className="text-[11px] text-zinc-500">
                                  Attn: {inv.client.name} &bull; <span className="font-mono text-zinc-400">{inv.client.tax_id || 'NTN'}</span>
                                </div>
                              </td>

                              <td className="py-3.5 px-4 text-zinc-400 tnum font-mono">
                                {inv.issue_date.slice(0, 10)}
                              </td>

                              <td className="py-3.5 px-4 text-zinc-400 tnum font-mono">
                                {inv.due_date.slice(0, 10)}
                              </td>

                              <td className="py-3.5 px-4 text-right font-medium text-white tnum font-mono">
                                <span className="text-[10px] text-zinc-500 mr-1">{inv.currency}</span>
                                {inv.total_amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                              </td>

                              <td className="py-3.5 px-4">
                                <span className={`inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium ${
                                  inv.status === 'PAID'
                                    ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/60'
                                    : inv.status === 'OVERDUE'
                                    ? 'bg-rose-950/60 text-rose-400 border border-rose-800/60'
                                    : 'bg-amber-950/60 text-amber-400 border border-amber-800/60'
                                }`}>
                                  <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${
                                    inv.status === 'PAID' ? 'bg-emerald-400' : inv.status === 'OVERDUE' ? 'bg-rose-400' : 'bg-amber-400'
                                  }`}></span>
                                  {inv.status === 'ISSUED' ? 'PENDING' : inv.status}
                                </span>
                              </td>

                              <td className="py-3.5 px-4 text-right space-x-2">
                                <button
                                  onClick={() => setSelectedInvoice(inv)}
                                  className="text-[11px] font-medium text-zinc-300 hover:text-white px-2 py-1 rounded bg-zinc-800/60 hover:bg-zinc-800 border border-zinc-700/60 transition">
                                  View Details
                                </button>

                                <a
                                  href={`http://localhost:8000/api/v1/invoices/${inv.id}/pdf`}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-1 text-[11px] font-medium text-indigo-400 hover:text-indigo-300 px-2 py-1 rounded bg-indigo-950/40 hover:bg-indigo-900/60 border border-indigo-800/60 transition">
                                  <span>PDF Invoice</span>
                                  <span className="text-[9px]">↗</span>
                                </a>

                                {inv.status !== 'PAID' && (
                                  <button
                                    onClick={() => handleMarkPaid(inv)}
                                    className="text-[11px] font-medium text-emerald-400 hover:text-emerald-300 px-2 py-1 rounded bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-800/60 transition">
                                    Mark Paid
                                  </button>
                                )}
                              </td>

                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>

                  <div className="p-3 border-t border-zinc-800 bg-[#0d0f16] flex items-center justify-between text-xs text-zinc-500">
                    <div>Showing {filteredInvoices.length} of {invoices.length} records</div>
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                      <span>Connected to FastAPI Engine (port 8000)</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: Client Directory */}
            {currentTab === 'clients' && (
              <div>
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <h2 className="text-sm font-semibold text-white">Registered Corporate Clients</h2>
                    <p className="text-xs text-zinc-400">Enterprise billing entities and FBR/PRA tax registrations</p>
                  </div>
                  <button
                    onClick={() => showToast("Client registration directory active.", "info")}
                    className="text-xs text-zinc-400 hover:text-zinc-200 border border-zinc-800 px-3 py-1.5 rounded-md">
                    Total Accounts: {clients.length}
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {clients.map(c => (
                    <div key={c.id} className="p-5 rounded-lg bg-[#10121a] border border-zinc-800 hover:border-zinc-700 transition shadow-sm">
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="font-semibold text-white text-sm">{c.company}</div>
                          <div className="text-xs text-zinc-400 mt-0.5">Contact: {c.name}</div>
                        </div>
                        <span className="text-[11px] font-mono text-zinc-300 px-2.5 py-0.5 rounded bg-zinc-800 border border-zinc-700">
                          {c.tax_id}
                        </span>
                      </div>
                      
                      <div className="mt-4 pt-3 border-t border-zinc-800/60 text-xs space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="text-zinc-500">Billing Email:</span>
                          <span className="text-zinc-300 font-mono">{c.email}</span>
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="text-zinc-500">Corporate Phone:</span>
                          <span className="text-zinc-300">{c.phone}</span>
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="text-zinc-500">Registered Office:</span>
                          <span className="text-zinc-300 truncate max-w-xs">{c.address}</span>
                        </div>
                      </div>

                      <div className="mt-4 pt-3 border-t border-zinc-800/60 flex items-center justify-between">
                        <span className="text-[11px] text-emerald-400">● Active B2B Account</span>
                        <button
                          onClick={() => {
                            setFormData({ ...formData, client_id: c.id });
                            setShowCreateModal(true);
                          }}
                          className="text-xs text-indigo-400 hover:text-indigo-300 font-medium">
                          Issue Invoice &rarr;
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: Audit & Compliance Trail */}
            {currentTab === 'audit' && (
              <div>
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <h2 className="text-sm font-semibold text-white">Immutable Compliance &amp; Audit Trail</h2>
                    <p className="text-xs text-zinc-400">Cryptographically tracked financial operations and status transitions</p>
                  </div>
                  <button
                    onClick={refreshData}
                    className="text-xs text-zinc-400 hover:text-zinc-200 border border-zinc-800 px-3 py-1.5 rounded-md hover:bg-zinc-800">
                    Refresh Trail ⟳
                  </button>
                </div>

                <div className="rounded-lg border border-zinc-800 bg-[#10121a] overflow-hidden">
                  <div className="divide-y divide-zinc-800/60">
                    {auditLogs.length === 0 ? (
                      <div className="p-8 text-center text-zinc-500 text-xs">
                        No audit events recorded yet. Perform an action like issuing an invoice or recording a payment.
                      </div>
                    ) : (
                      auditLogs.map(log => (
                        <div key={log.id} className="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 hover:bg-zinc-800/20 transition">
                          <div className="flex items-start gap-3">
                            <div className="w-8 h-8 rounded bg-zinc-800 border border-zinc-700 flex items-center justify-center font-mono text-[11px] text-zinc-300 mt-0.5">
                              LOG
                            </div>
                            <div>
                              <div className="flex items-center gap-2">
                                <span className={`text-[10px] font-mono font-medium px-2 py-0.5 rounded ${
                                  log.action.includes('PAYMENT')
                                    ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/60'
                                    : 'bg-indigo-950/60 text-indigo-400 border border-indigo-800/60'
                                }`}>
                                  {log.action}
                                </span>
                                <span className="text-xs font-medium text-zinc-200">{log.resource_type} #{log.resource_id}</span>
                              </div>
                              <p className="text-xs text-zinc-400 mt-1">{log.details}</p>
                            </div>
                          </div>

                          <div className="text-right self-end sm:self-center">
                            <div className="text-[11px] text-zinc-400 font-mono">
                              {new Date(log.timestamp).toLocaleString()}
                            </div>
                            <div className="text-[10px] text-zinc-500 font-mono">
                              actor: {log.user_email || 'hamza@payflow.pk'}
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* DETAIL MODAL / DRAWER (Zero raw JSON, 100% human-readable) */}
          {selectedInvoice && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#12141f] border border-zinc-800 rounded-lg max-w-2xl w-full p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
                
                <div className="flex items-start justify-between border-b border-zinc-800 pb-4 mb-4">
                  <div>
                    <div className="flex items-center gap-2.5">
                      <h3 className="font-semibold text-white text-base font-mono">{selectedInvoice.invoice_number}</h3>
                      <span className={`text-[11px] font-medium px-2 py-0.5 rounded ${
                        selectedInvoice.status === 'PAID'
                          ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/60'
                          : selectedInvoice.status === 'OVERDUE'
                          ? 'bg-rose-950/60 text-rose-400 border border-rose-800/60'
                          : 'bg-amber-950/60 text-amber-400 border border-amber-800/60'
                      }`}>
                        {selectedInvoice.status}
                      </span>
                    </div>
                    <p className="text-xs text-zinc-400 mt-0.5">
                      Issued: {selectedInvoice.issue_date.slice(0, 10)} &bull; Due: {selectedInvoice.due_date.slice(0, 10)}
                    </p>
                  </div>

                  <button 
                    onClick={() => setSelectedInvoice(null)}
                    className="text-zinc-500 hover:text-white p-1 text-base">
                    ✕
                  </button>
                </div>

                {/* Counterparty Information */}
                <div className="grid grid-cols-2 gap-4 p-4 rounded-md bg-[#161825] border border-zinc-800 text-xs mb-4">
                  <div>
                    <span className="text-[10px] text-zinc-500 uppercase tracking-wider font-semibold">Billed Counterparty</span>
                    <div className="text-zinc-200 font-semibold mt-1">{selectedInvoice.client.company}</div>
                    <div className="text-zinc-400">{selectedInvoice.client.name}</div>
                    <div className="text-zinc-400 font-mono text-[11px]">{selectedInvoice.client.email}</div>
                  </div>
                  <div>
                    <span className="text-[10px] text-zinc-500 uppercase tracking-wider font-semibold">Tax &amp; Remittance Terms</span>
                    <div className="text-zinc-300 font-mono mt-1">NTN: {selectedInvoice.client.tax_id || 'Exempt / None'}</div>
                    <div className="text-zinc-400">Currency: {selectedInvoice.currency}</div>
                    <div className="text-zinc-400">PRA Sales Tax Rate: 16%</div>
                  </div>
                </div>

                {/* Line Items Table */}
                <div className="mb-4">
                  <h4 className="text-xs font-semibold text-zinc-300 mb-2">Itemized Professional Services</h4>
                  <div className="rounded border border-zinc-800 overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#161825] text-zinc-400 font-medium">
                        <tr>
                          <th className="py-2.5 px-3">Description</th>
                          <th className="py-2.5 px-3 text-center">Qty</th>
                          <th className="py-2.5 px-3 text-right">Unit Price</th>
                          <th className="py-2.5 px-3 text-right">Total</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-800/60 bg-[#12141f]">
                        {(selectedInvoice.items || [
                          { description: selectedInvoice.notes || "Professional Engineering Consultation", quantity: 1, unit_price: selectedInvoice.subtotal, total: selectedInvoice.subtotal }
                        ]).map((it, idx) => (
                          <tr key={idx}>
                            <td className="py-2.5 px-3 text-zinc-200">{it.description}</td>
                            <td className="py-2.5 px-3 text-center text-zinc-400 font-mono">{it.quantity}</td>
                            <td className="py-2.5 px-3 text-right text-zinc-400 font-mono">
                              PKR {it.unit_price.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                            </td>
                            <td className="py-2.5 px-3 text-right text-white font-medium font-mono">
                              PKR {(it.total || (it.quantity * it.unit_price)).toLocaleString('en-US', { minimumFractionDigits: 2 })}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Financial Summary */}
                <div className="p-3.5 rounded bg-[#161825] border border-zinc-800 text-xs space-y-1.5 mb-4">
                  <div className="flex justify-between text-zinc-400">
                    <span>Subtotal (Net Services):</span>
                    <span className="font-mono text-zinc-200">PKR {selectedInvoice.subtotal.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                  </div>
                  <div className="flex justify-between text-zinc-400">
                    <span>Punjab Revenue Authority Sales Tax (PRA @ 16%):</span>
                    <span className="font-mono text-zinc-200">PKR {selectedInvoice.tax_amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                  </div>
                  <div className="flex justify-between text-white font-semibold pt-2 border-t border-zinc-800">
                    <span>Total Amount Payable:</span>
                    <span className="font-mono text-emerald-400 text-sm">PKR {selectedInvoice.total_amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                  </div>
                </div>

                {/* Bank Remittance Instructions */}
                <div className="p-3.5 rounded bg-[#0f1118] border border-zinc-800/80 text-xs space-y-1 mb-5">
                  <div className="font-medium text-zinc-300">Bank Remittance Instructions</div>
                  <div className="text-zinc-400">Habib Bank Limited (HBL) &bull; Corporate Banking Wing, Lahore</div>
                  <div className="text-zinc-300 font-mono text-[11px]">IBAN: PK36HABB0001234567890123 &bull; RAAST ID: 03446751031</div>
                </div>

                {/* Action Bar */}
                <div className="flex items-center justify-between pt-2 border-t border-zinc-800">
                  <div className="flex gap-2">
                    <a
                      href={`http://localhost:8000/api/v1/invoices/${selectedInvoice.id}/pdf`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3.5 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition inline-flex items-center gap-1.5 shadow-sm">
                      <span>View &amp; Print PDF</span>
                      <span className="text-[10px]">↗</span>
                    </a>
                  </div>

                  <div className="flex gap-2">
                    {selectedInvoice.status !== 'PAID' && (
                      <button
                        onClick={() => handleMarkPaid(selectedInvoice)}
                        className="px-3.5 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs transition shadow-sm">
                        Mark Reconciled &amp; Paid
                      </button>
                    )}
                    <button
                      onClick={() => setSelectedInvoice(null)}
                      className="px-3.5 py-1.5 rounded-md border border-zinc-800 text-zinc-400 hover:text-white text-xs transition">
                      Close
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* CREATE INVOICE MODAL */}
          {showCreateModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#12141f] border border-zinc-800 rounded-lg max-w-lg w-full p-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3 mb-4">
                  <div>
                    <h3 className="font-semibold text-white text-sm">Issue New Corporate Invoice</h3>
                    <p className="text-[11px] text-zinc-400">B2B Financial Ledger &bull; FBR / PRA Compliant</p>
                  </div>
                  <button onClick={() => setShowCreateModal(false)} className="text-zinc-500 hover:text-white text-sm">
                    ✕
                  </button>
                </div>

                <form onSubmit={handleCreateInvoice} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-zinc-400 mb-1 font-medium">Billed Client Account</label>
                    <select
                      value={formData.client_id}
                      onChange={e => setFormData({...formData, client_id: e.target.value})}
                      className="w-full bg-[#181a28] border border-zinc-800 rounded-md px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-600">
                      {clients.map(c => (
                        <option key={c.id} value={c.id}>{c.company} &mdash; {c.name} ({c.tax_id})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-zinc-400 mb-1 font-medium">Payment Due Maturity (Net Terms)</label>
                    <input
                      type="date"
                      value={formData.due_date}
                      onChange={e => setFormData({...formData, due_date: e.target.value})}
                      className="w-full bg-[#181a28] border border-zinc-800 rounded-md px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-600 font-mono"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-zinc-400 font-medium">Service Line Items</label>
                      <button
                        type="button"
                        onClick={addItemRow}
                        className="text-indigo-400 hover:text-indigo-300 text-[11px] font-medium">
                        + Add Service Item
                      </button>
                    </div>

                    <div className="space-y-2">
                      {formData.items.map((item, idx) => (
                        <div key={idx} className="flex gap-2 items-center">
                          <input
                            type="text"
                            placeholder="Description of deliverables"
                            value={item.description}
                            onChange={e => updateItem(idx, 'description', e.target.value)}
                            required
                            className="flex-1 bg-[#181a28] border border-zinc-800 rounded px-2.5 py-1.5 text-zinc-200"
                          />
                          <input
                            type="number"
                            min="1"
                            placeholder="Qty"
                            value={item.quantity}
                            onChange={e => updateItem(idx, 'quantity', e.target.value)}
                            required
                            className="w-14 bg-[#181a28] border border-zinc-800 rounded px-2 py-1.5 text-zinc-200 text-center font-mono"
                          />
                          <input
                            type="number"
                            placeholder="Rate (PKR)"
                            value={item.unit_price}
                            onChange={e => updateItem(idx, 'unit_price', e.target.value)}
                            required
                            className="w-28 bg-[#181a28] border border-zinc-800 rounded px-2 py-1.5 text-zinc-200 text-right font-mono"
                          />
                          {formData.items.length > 1 && (
                            <button
                              type="button"
                              onClick={() => removeItemRow(idx)}
                              className="text-zinc-500 hover:text-rose-400 px-1 text-sm">
                              ✕
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-zinc-400 mb-1 font-medium">Payment Notes &amp; Wire Instructions</label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({...formData, notes: e.target.value})}
                      className="w-full bg-[#181a28] border border-zinc-800 rounded-md px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-600"
                    />
                  </div>

                  <div className="pt-3 border-t border-zinc-800 flex items-center justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => setShowCreateModal(false)}
                      className="px-3.5 py-1.5 rounded-md border border-zinc-800 text-zinc-400 hover:text-white transition">
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition shadow-sm">
                      Issue &amp; Dispatch Invoice
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notifications */}
          {notification && (
            <div className="fixed bottom-5 right-5 bg-zinc-900 border border-zinc-700 text-zinc-100 px-4 py-2.5 rounded-md shadow-2xl text-xs font-medium z-50 flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>{notification.text}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
