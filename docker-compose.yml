version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: payflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-payflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow_user -d payflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payflow-fastapi-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://payflow_user:payflow_secret_2026@db:5432/payflow_db
      SECRET_KEY: ${SECRET_KEY:-super-secret-enterprise-jwt-key-for-pakistan-it-industry-2026}
      NODE_WORKER_URL: http://worker:5001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    container_name: payflow-node-worker
    restart: always
    environment:
      PORT: 5001
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payflow-react-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
